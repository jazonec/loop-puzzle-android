plugins { id 'com.android.application' }

android {
    namespace 'io.github.jazonec.looppuzzle'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.jazonec.looppuzzle'
        minSdk 26
        targetSdk 35
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '0.1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

tasks.register('checkWebAssets') {
    doLast {
        ['index.html', 'style.css', 'app.js', 'puzzle.js'].each { name ->
            if (!file("src/main/assets/www/${name}").exists()) {
                throw new GradleException('Missing game assets. Run npm run android:prepare first.')
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'checkWebAssets' }
