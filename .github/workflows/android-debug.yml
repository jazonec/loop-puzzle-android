name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test puzzle rules
        run: npm test

      - name: Package offline game
        run: npm run android:prepare

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-signing-v1

      - name: Install Android SDK components on GitHub
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'

      - name: Build debug APK
        shell: bash
        run: |
          if gradle -p android assembleDebug lintDebug --no-daemon --stacktrace > android-build.log 2>&1; then
            cat android-build.log
          else
            cat android-build.log
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const log = readFileSync('android-build.log', 'utf8');
          const start = log.indexOf('FAILURE:');
          const detail = (start >= 0 ? log.slice(start) : log).slice(0, 12000);
          console.log('::error title=Android build details::' + detail.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A'));
          NODE
            exit 1
          fi

      - name: Verify signature and prepare download
        shell: bash
        run: |
          mkdir -p outputs/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk outputs/apk/loop-puzzle-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs outputs/apk/loop-puzzle-debug.apk
          cd outputs/apk
          sha256sum loop-puzzle-debug.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loop-puzzle-debug-apk
          path: outputs/apk/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Build summary
        run: |
          echo '### Loop Puzzle — debug APK' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download **loop-puzzle-debug-apk** below and unzip it. Install **loop-puzzle-debug.apk** on Android 8.0 or later.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The game is bundled in the APK and works offline. It does not use the hosted website.' >> "$GITHUB_STEP_SUMMARY"
